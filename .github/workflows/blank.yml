name: Daily Chart Scrape

on:
  schedule:
    # Runs once a day at 09:00 UTC — adjust to whenever charts refresh
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scrape
        run: python daily_scrape.py
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          # add other scraper secrets here as needed

      - name: Commit updated database
        run: |
          git config user.name "chart-scraper-bot"
          git config user.email "actions@github.com"
          git add chart_history.db
          git diff --staged --quiet || git commit -m "Daily chart scrape: $(date -u +%Y-%m-%d)"
          git push
